<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Bad: photos, gradients and shading have no clear lines to trace -->
  <defs>
    <radialGradient id="shade" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset=".55" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e3"/>
      <stop offset="1" stop-color="#6d7f91"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky)"/>
  <circle cx="150" cy="100" r="70" fill="url(#shade)"/>
</svg>
